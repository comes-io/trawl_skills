name: Promote

# Promotes a published candidate from the npm `next` dist-tag to `latest`
# (comes-io/trawl_skills#46), so a release needs no local `npm login`.
# release.yml publishes to `next` via OIDC; this workflow moves `latest` with
# the granular token NPM_PROMOTE_TOKEN (scope @trawlme, never printed).
# Run: gh workflow run promote.yml -R comes-io/trawl_skills -f version=X.Y.Z
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version currently on the next tag to promote to latest (X.Y.Z)'
        required: true
        type: string

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the version is the next candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1
          fi
          npm view "@trawlme/skills@$VERSION" version >/dev/null \
            || { echo "::error::@trawlme/skills@$VERSION is not published"; exit 1; }
          NEXT=$(npm view @trawlme/skills dist-tags.next)
          if [ "$NEXT" != "$VERSION" ]; then
            echo "::error::next is '$NEXT', not '$VERSION' - only the current next candidate is promoted"; exit 1
          fi

      - name: Promote next to latest
        env:
          VERSION: ${{ inputs.version }}
          NPM_PROMOTE_TOKEN: ${{ secrets.NPM_PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NPM_PROMOTE_TOKEN" ]; then
            echo "::error::secret NPM_PROMOTE_TOKEN is not set (npm granular token, @trawlme scope, read-write)"; exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_PROMOTE_TOKEN" > "$RUNNER_TEMP/.npmrc"
          npm dist-tag add "@trawlme/skills@$VERSION" latest --userconfig "$RUNNER_TEMP/.npmrc"
          rm -f "$RUNNER_TEMP/.npmrc"

      - name: Verify latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          LATEST=$(npm view @trawlme/skills dist-tags.latest)
          if [ "$LATEST" != "$VERSION" ]; then
            echo "::error::latest is '$LATEST', expected '$VERSION'"; exit 1
          fi
          echo "latest -> $LATEST"
